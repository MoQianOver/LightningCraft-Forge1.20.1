modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
credits = "SBlectric - original creator, Ancient_crafter - structure generation assistance. Ported to Minecraft 1.20.1 / Forge 47.x."
logoFile = "logo.png"
displayURL = "https://github.com/MoQianOver/LightningCraft-Forge1.20.1"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# JEI 是软依赖：只影响配方展示，没装也能正常玩
[[dependencies."${mod_id}"]]
modId = "jei"
mandatory = false
versionRange = "[15,)"
ordering = "AFTER"
side = "BOTH"
